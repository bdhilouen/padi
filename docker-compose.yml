version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: citizenhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: citizenhub
      POSTGRES_PASSWORD: citizenhub123
      POSTGRES_DB: citizenhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: citizenhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: